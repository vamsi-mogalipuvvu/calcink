<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CalcInk – handwrite math expressions and get instant answers, 100% offline." />
    <title>CalcInk – Handwritten Math Calculator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- ── Header ───────────────────────────────────────── -->
      <header class="app-header">
        <div class="brand">
          <span class="brand-icon">✏️</span>
          <h1 class="brand-name">CalcInk</h1>
        </div>
        <p class="brand-tagline">Write math by hand • Get answers instantly</p>
      </header>

      <!-- ── Toolbar ──────────────────────────────────────── -->
      <nav class="toolbar" aria-label="Drawing toolbar">
        <div class="toolbar-group">
          <button id="btn-undo" class="tool-btn" title="Undo (Ctrl+Z)" aria-label="Undo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            <span>Undo</span>
          </button>
          <button id="btn-redo" class="tool-btn" title="Redo (Ctrl+Y)" aria-label="Redo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
            <span>Redo</span>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <button id="btn-pen" class="tool-btn active" title="Pen tool" aria-label="Pen" aria-pressed="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
            <span>Pen</span>
          </button>
          <button id="btn-stroke-eraser" class="tool-btn" title="Stroke eraser – removes whole stroke" aria-label="Stroke eraser" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16l11-11 7 7-3.5 3.5"/><path d="M6.5 17.5l4-4"/></svg>
            <span>Stroke</span>
          </button>
          <button id="btn-pixel-eraser" class="tool-btn" title="Pixel eraser – erases ink area" aria-label="Pixel eraser" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="14" width="8" height="8" rx="1"/><path d="M22 3L11 14l4 4L26 7"/><path d="M14 14l-4 4"/></svg>
            <span>Pixel</span>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group width-group">
          <label for="stroke-width" class="slider-label">Width</label>
          <input type="range" id="stroke-width" min="1" max="20" value="3" step="0.5"
                 aria-label="Stroke width" />
          <span id="stroke-width-val" class="slider-val">3</span>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <button id="btn-sound" class="tool-btn active" title="Sound feedback" aria-label="Sound feedback" aria-pressed="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            <span>Sound</span>
          </button>
          <button id="btn-confidence" class="tool-btn active" title="Confidence marks" aria-label="Confidence marks" aria-pressed="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M7 15l3-3 3 2 4-6"/><path d="M17 8h3v3"/></svg>
            <span>Confidence</span>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <button id="btn-comer-toggle" class="tool-btn toggle toggle-off" title="Use Experimental CoMER Model" aria-label="Toggle CoMER" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span>CoMER</span>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <button id="btn-clear" class="tool-btn danger" title="Clear canvas" aria-label="Clear all">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          <span>Clear</span>
        </button>
      </nav>

      <!-- ── Canvas area ──────────────────────────────────── -->
      <main class="canvas-container" id="canvas-container">
        <canvas id="main-canvas" aria-label="Drawing canvas – write your math expression here"></canvas>
        <!-- Answer overlay – drawn on top of ink, never modifies ink canvas -->
        <canvas id="answer-canvas" class="answer-overlay" aria-hidden="true"></canvas>
        <!-- pixel-eraser cursor overlay -->
        <div id="pixel-eraser-cursor" class="pixel-eraser-cursor" aria-hidden="true"></div>
        <!-- Recognition status indicator -->
        <div id="recognition-status" class="recognition-status" aria-live="polite" aria-label="Recognition status"></div>
      </main>

      <!-- ── Dev debug panel ──────────────────────────────── -->
      <div id="debug-panel" class="debug-panel" aria-label="Recognition debug info">
        <span class="debug-label">Recognized:</span>
        <span id="debug-expr" class="debug-expr">—</span>
        <span class="debug-sep">│</span>
        <span class="debug-label">Groups:</span>
        <span id="debug-groups" class="debug-groups">—</span>
      </div>

      <!-- ── Status bar ───────────────────────────────────── -->
      <footer class="status-bar">
        <span id="status-tool">Tool: Pen</span>
        <span id="status-strokes">Strokes: 0</span>
        <span id="status-hint">✨ Write an expression ending with = and CalcInk will answer! Tip: scribble over ink to erase it.</span>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
